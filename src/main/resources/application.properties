spring.application.name=demo
server.port=8081

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always

spring.cloud.aws.region.static=us-east-1
cloud.aws.credentials.instance-profile=false
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}


aws.sqs.queue.saida-estoque=SQS-SAIDA-ESTOQUE.fifo
aws.sqs.queue.entrada-estoque=SQS-ENTRADA-ESTOQUE.fifo
queue.order-events=T04N_FELIPE_KENJI_INOMATA_LAMB.fifo
aws.sqs.queue.dlq-name=T04N_FELIPE_KENJI_INOMATA_LAMB-DLQ.fifo

spring.cloud.aws.sqs.listener.queue-not-found-strategy=fail